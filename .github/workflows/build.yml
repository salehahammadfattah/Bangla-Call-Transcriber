package com.banglatranscriber.app

import android.app.*
import android.content.Intent
import android.content.pm.ServiceInfo
import android.media.AudioFormat
import android.media.AudioRecord
import android.media.MediaRecorder
import android.os.Build
import android.os.IBinder
import androidx.core.app.NotificationCompat
import kotlinx.coroutines.*
import java.io.File
import kotlin.math.abs

class TranscriptionService : Service() {

    companion object {
        const val CHANNEL_ID = "transcription_channel"
        const val NOTIFICATION_ID = 1
        const val SAMPLE_RATE = 16000
        const val CHUNK_SECONDS = 4
        var onTranscriptUpdate: ((String) -> Unit)? = null
    }

    private var audioRecord: AudioRecord? = null
    @Volatile private var isRecording = false
    private lateinit var whisper: WhisperBridge
    private val serviceScope =
        CoroutineScope(Dispatchers.Default + SupervisorJob())

    override fun onCreate() {
        super.onCreate()
        whisper = WhisperBridge()
        createNotificationChannel()
    }

    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        val modelPath = intent?.getStringExtra("model_path")
            ?: File(filesDir, "models/bangla-whisper.bin").absolutePath

        startForeground(
            NOTIFICATION_ID,
            buildNotification("মাইক্রোফোন চালু হচ্ছে..."),
            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)
                ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE else 0
        )

        serviceScope.launch {
            try {
                if (!whisper.loadModel(modelPath)) {
                    postStatus("⚠️ বাংলা Whisper মডেল লোড হয়নি।\n$modelPath")
                    stopSelf()
                    return@launch
                }
                postStatus("🎤 মাইক্রোফোন চালু হচ্ছে...")
                startCapture()
            } catch (e: Exception) {
                postStatus("❌ শুরু করতে সমস্যা: ${e.message ?: "অজানা সমস্যা"}")
                stopSelf()
            }
        }
        return START_STICKY
    }

    @Suppress("MissingPermission")
    private fun startCapture() {
        val minBufSize = AudioRecord.getMinBufferSize(
            SAMPLE_RATE,
            AudioFormat.CHANNEL_IN_MONO,
            AudioFormat.ENCODING_PCM_16BIT
        )

        if (minBufSize <= 0) {
            postStatus("❌ ফোনে 16 kHz microphone input পাওয়া যাচ্ছে না")
            return
        }

        val bufferSize = maxOf(minBufSize * 2, SAMPLE_RATE * 2)

        // Speech-recognition source first; ordinary MIC as fallback.
        val sources = intArrayOf(
            MediaRecorder.AudioSource.VOICE_RECOGNITION,
            MediaRecorder.AudioSource.MIC
        )

        var recorder: AudioRecord? = null

        for (source in sources) {
            try {
                val candidate = AudioRecord(
                    source,
                    SAMPLE_RATE,
                    AudioFormat.CHANNEL_IN_MONO,
                    AudioFormat.ENCODING_PCM_16BIT,
                    bufferSize
                )

                if (candidate.state == AudioRecord.STATE_INITIALIZED) {
                    recorder = candidate
                    postStatus(
                        if (source == MediaRecorder.AudioSource.VOICE_RECOGNITION)
                            "🎤 Voice Recognition microphone চালু"
                        else
                            "🎤 Normal microphone চালু"
                    )
                    break
                }
                candidate.release()
            } catch (_: Exception) {
                // Try the fallback source.
            }
        }

        if (recorder == null) {
            postStatus("❌ মাইক্রোফোন initialize করা যায়নি")
            return
        }

        audioRecord = recorder

        try {
            recorder.startRecording()
        } catch (e: Exception) {
            postStatus("❌ microphone recording শুরু হয়নি: ${e.message}")
            recorder.release()
            audioRecord = null
            return
        }

        if (recorder.recordingState != AudioRecord.RECORDSTATE_RECORDING) {
            postStatus("❌ microphone recording state ঠিক হয়নি")
            recorder.release()
            audioRecord = null
            return
        }

        isRecording = true
        postStatus("🎤 শুনছে... কথা বলুন")

        val chunkSamples = SAMPLE_RATE * CHUNK_SECONDS
        val pcmBuffer = ShortArray(chunkSamples)

        serviceScope.launch {
            while (isRecording) {
                var offset = 0

                while (offset < chunkSamples && isRecording) {
                    val read = try {
                        recorder.read(
                            pcmBuffer,
                            offset,
                            chunkSamples - offset
                        )
                    } catch (e: Exception) {
                        postStatus("❌ microphone read error: ${e.message ?: "অজানা"}")
                        -1
                    }

                    when {
                        read > 0 -> offset += read
                        read == 0 -> delay(10)
                        else -> {
                            postStatus("❌ microphone থেকে audio পাওয়া যাচ্ছে না (read=$read)")
                            isRecording = false
                            break
                        }
                    }
                }

                if (!isRecording) break

                if (offset > 0) {
                    var peak = 0
                    var sumAbs = 0L

                    for (i in 0 until offset) {
                        val v = abs(pcmBuffer[i].toInt())
                        if (v > peak) peak = v
                        sumAbs += v
                    }

                    val averageAbs = sumAbs.toDouble() / offset.toDouble()

                    if (peak < 20 && averageAbs < 2.0) {
                        postStatus("🎤 শুনছে... কিন্তু microphone-এ শব্দ খুব কম")
                        continue
                    }

                    postStatus("🧠 বাংলা কথা বিশ্লেষণ করছে...")

                    try {
                        val floatSamples = FloatArray(offset) { i ->
                            pcmBuffer[i] / 32768.0f
                        }

                        val text = whisper.transcribe(floatSamples)

                        if (text.isNotBlank()) {
                            withContext(Dispatchers.Main) {
                                onTranscriptUpdate?.invoke(text.trim())
                            }
                            postStatus("🎤 শুনছে... কথা বলুন")
                        } else {
                            postStatus("🎤 শুনছে... এই অংশে স্পষ্ট কথা পাওয়া যায়নি")
                        }
                    } catch (e: Exception) {
                        postStatus(
                            "❌ Whisper transcription error: ${e.message ?: "অজানা সমস্যা"}"
                        )
                    }
                }
            }
        }
    }

    private fun postStatus(message: String) {
        serviceScope.launch(Dispatchers.Main) {
            onTranscriptUpdate?.invoke(message)
        }
    }

    private fun createNotificationChannel() {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val channel = NotificationChannel(
                CHANNEL_ID,
                "লাইভ ট্রান্সক্রিপশন",
                NotificationManager.IMPORTANCE_LOW
            )
            getSystemService(NotificationManager::class.java)
                .createNotificationChannel(channel)
        }
    }

    private fun buildNotification(text: String): Notification =
        NotificationCompat.Builder(this, CHANNEL_ID)
            .setContentTitle("বাংলা কল ট্রান্সক্রাইবার")
            .setContentText(text)
            .setSmallIcon(android.R.drawable.ic_btn_speak_now)
            .setOngoing(true)
            .build()

    override fun onDestroy() {
        isRecording = false
        try { audioRecord?.stop() } catch (_: Exception) {}
        audioRecord?.release()
        audioRecord = null
        try { whisper.release() } catch (_: Exception) {}
        serviceScope.cancel()
        super.onDestroy()
    }

    override fun onBind(intent: Intent?): IBinder? = null
}
