name: Build Bangla Call Transcriber APK

# GitHub Actions থেকে Run workflow করা যাবে,
# অথবা main branch-এ push করলে অটোমেটিক build হবে।
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: কোড চেকআউট করা
        uses: actions/checkout@v4

      # whisper.cpp-এর বর্তমান source checkout করা হবে।
      # পুরোনো/অসম্পূর্ণ local copy থাকলে সরিয়ে নতুন করে clone করি।
      - name: whisper.cpp clone করা
        run: |
          rm -rf app/src/main/cpp/whisper.cpp
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp

          test -f app/src/main/cpp/whisper.cpp/CMakeLists.txt
          test -f app/src/main/cpp/whisper.cpp/models/convert-h5-to-ggml.py

          echo "whisper.cpp files:"
          ls -la app/src/main/cpp/whisper.cpp/models | head -40

      - name: JDK 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK সেটআপ
        uses: android-actions/setup-android@v3

      - name: NDK ও CMake ইনস্টল
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Python 3.10 সেটআপ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # IMPORTANT:
      # বর্তমান whisper.cpp-এ requirements-convert-hf-to-ggml.txt নেই।
      # তাই সেই ফাইল install করা যাবে না। Converter-এর প্রয়োজনীয় package সরাসরি install করা হচ্ছে।
      - name: Model conversion dependencies ইনস্টল
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy<2" \
            "transformers==4.30.1" \
            "huggingface_hub" \
            "safetensors" \
            "sentencepiece" \
            "accelerate"

          # CPU PyTorch: GitHub runner-এ conversion-এর জন্য যথেষ্ট।
          pip install torch --index-url https://download.pytorch.org/whl/cpu

          python - <<'PY'
          import torch
          import transformers
          import numpy
          print("torch:", torch.__version__)
          print("transformers:", transformers.__version__)
          print("numpy:", numpy.__version__)
          PY

      - name: বাংলা Whisper model download করা
        env:
          HF_MODEL: bangla-speech-processing/BanglaASR
        run: |
          rm -rf hf_model
          mkdir -p hf_model

          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download

          model = os.environ["HF_MODEL"]

          # Training/checkpoint files (optimizer, rng_state, scheduler, etc.)
          # download না করে শুধু inference/conversion-এর প্রয়োজনীয় files নেওয়া হচ্ছে।
          snapshot_download(
              repo_id=model,
              local_dir="./hf_model",
              allow_patterns=[
                  "config.json",
                  "generation_config.json",
                  "preprocessor_config.json",
                  "special_tokens_map.json",
                  "tokenizer_config.json",
                  "vocab.json",
                  "merges.txt",
                  "normalizer.json",
                  "added_tokens.json",
                  "model.safetensors",
              ],
          )
          PY

          echo "Downloaded model files:"
          ls -lah hf_model

          # Converter-এর জন্য আবশ্যিক files আছে কি না যাচাই।
          test -s hf_model/config.json
          test -s hf_model/vocab.json
          test -s hf_model/added_tokens.json
          test -s hf_model/model.safetensors

      - name: OpenAI Whisper repository clone করা
        run: |
          rm -rf openai-whisper
          git clone --depth 1 https://github.com/openai/whisper.git openai-whisper
          test -f openai-whisper/whisper/assets/mel_filters.npz

      - name: বাংলা Whisper model GGML-এ convert করা
        run: |
          rm -rf models_work
          mkdir -p models_work

          # বর্তমান convert-h5-to-ggml.py-এর official argument order:
          # 1) HF model directory
          # 2) OpenAI whisper repository
          # 3) output directory
          python app/src/main/cpp/whisper.cpp/models/convert-h5-to-ggml.py \
            ./hf_model \
            ./openai-whisper \
            ./models_work

          test -s models_work/ggml-model.bin
          cp models_work/ggml-model.bin ./bangla-whisper.bin

          echo "Converted model:"
          ls -lh bangla-whisper.bin

      - name: Model assets-এ copy করা
        run: |
          mkdir -p app/src/main/assets/models
          cp bangla-whisper.bin app/src/main/assets/models/bangla-whisper.bin
          ls -lh app/src/main/assets/models/bangla-whisper.bin

      - name: Gradle wrapper executable করা
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Debug APK build করা
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: APK upload করা
        uses: actions/upload-artifact@v4
        with:
          name: BanglaCallTranscriber-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
